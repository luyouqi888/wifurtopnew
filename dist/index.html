<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="路绒Lab · WiFurLab，欢迎前往我们的新网站。">
  <title>路绒Lab · WiFurLab</title>
  <link rel="canonical" href="https://wifurlab.com/">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fff}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased}
    .hero{position:relative;isolation:isolate;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:40px 24px}
    .glow{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(100px);animation:float 18s ease-in-out infinite alternate}
    .glow.one{top:-10%;right:-5%;width:70%;height:70%;background:rgb(30 58 138 / 10%)}
    .glow.two{bottom:-15%;left:-10%;width:80%;height:80%;background:rgb(49 46 129 / 10%);filter:blur(120px);animation-direction:alternate-reverse}
    .glow.three{top:20%;left:10%;width:50%;height:50%;background:rgb(30 64 175 / 8%);animation-duration:20s}
    .content{text-align:center;animation:appear 1.1s ease-out both}
    h1{margin:0;font-size:clamp(64px,10vw,128px);font-weight:600;letter-spacing:-.065em;line-height:1.2;white-space:nowrap}
    h1 span{color:#1e3a8a;font-weight:700}
    p{margin:40px 0 0;font-size:clamp(16px,2vw,24px);font-weight:300;line-height:1.6;letter-spacing:.2em;text-transform:uppercase;color:#64748b}
    p span{color:#1e293b;font-weight:400}
    a{display:inline-flex;align-items:center;justify-content:center;margin-top:64px;padding:17px 40px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-size:18px;font-weight:500;box-shadow:0 16px 32px rgb(30 58 138 / 12%);transition:transform .2s,box-shadow .2s;min-height:56px}
    a:hover{transform:translateY(-3px);box-shadow:0 20px 36px rgb(15 23 42 / 18%)}
    a:active{transform:scale(.98)}
    a:focus-visible{outline:3px solid #2563eb;outline-offset:6px}
    @keyframes float{to{transform:translate(30px,-25px) scale(1.12)}}
    @keyframes appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:480px){p{margin-top:30px}a{margin-top:48px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="hero">
    <div class="glow one" aria-hidden="true"></div>
    <div class="glow two" aria-hidden="true"></div>
    <div class="glow three" aria-hidden="true"></div>
    <div class="content">
      <h1>路绒<span>Lab</span></h1>
      <p>Welcome to<br><span>WiFurLab</span></p>
      <a href="https://wifurlab.com/">前往新网站</a>
    </div>
  </main>
</body>
</html>
